name: Test regression scanner price recovery

on:
  pull_request:
    paths:
      - "regression_scanner/scanner.py"
      - "regression_scanner/tests/**"
      - ".github/workflows/test-regression-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install scanner test dependencies
        run: python -m pip install "pytest>=8,<10" "numpy>=1.26,<3" "pandas>=2.2,<4" "yfinance>=1,<2" "pandas_market_calendars>=5,<6" "python-dotenv>=1,<2"
      - name: Compile scanner
        run: python -m compileall -q regression_scanner/scanner.py regression_scanner/tests
      - name: Run offline price recovery tests
        run: python -m pytest -q regression_scanner/tests/test_cloud_recovery.py
