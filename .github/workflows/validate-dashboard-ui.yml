name: Validate dashboard UI source

on:
  pull_request:
    paths:
      - "app.py"
      - "dashboard_theme.py"
      - "pages/0_Stock_Intelligence.py"
      - "pages/2_News_Sentiment.py"
      - "regression_scanner/app.py"
      - ".github/workflows/validate-dashboard-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile modified Streamlit pages
        run: |
          python -m py_compile app.py dashboard_theme.py pages/0_Stock_Intelligence.py regression_scanner/app.py
      - name: Verify navigation and pagination controls
        run: |
          python - <<'PY'
          from pathlib import Path
          nav = Path('app.py').read_text()
          theme = Path('dashboard_theme.py').read_text()
          stock = Path('pages/0_Stock_Intelligence.py').read_text()
          scanner = Path('regression_scanner/app.py').read_text()
          assert "title='Metrics & Competition'" in nav
          assert "'Metrics & Competition'" in theme
          assert 'render_page_header("Metrics & Competition"' in stock
          # Load Stock is a primary form submit button. It should visually
          # match Run Scan rather than falling back to the form-default style.
          assert 'type="primary",\n        use_container_width=True' in stock
          assert '[class*="st-key-stock_search"] [data-testid="stFormSubmitButton"]' in stock
          assert 'width: min(240px, 100%)' in stock
          assert 'peers_col, metrics_col = st.columns([1, 1], gap="medium")' in stock
          assert 'st.columns([0.86, 0.14], gap="small")' in stock
          assert 'st.columns([0.91, 0.09], gap="small")' in stock
          assert 'key="stock_price_chart_glass"' in stock
          assert 'key="peer_chart_glass"' in stock
          assert 'max-width: 590px' in stock
          assert 'max-width: 650px' in stock
          assert 'key=f"metrics_risk_period_{symbol}"' in stock
          assert 'with st.container(key="regression_chart_glass"):' in scanner
          assert 'with results_slot.container(key="regression_results_surface"):' in scanner
          assert 'c_filter, c_sort, _filter_deadspace' in scanner
          for marker in (".st-key-stock_price_chart_glass", ".st-key-peer_chart_glass",
                         ".st-key-regression_chart_glass", ".st-key-regression_results_surface"):
              assert marker in theme
          assert 'background:rgba(14,59,96,.80)' in theme
          assert '[data-baseweb="tag"]' in theme
          assert 'button[kind="primaryFormSubmit"]' in theme
          assert 'button[kind="primaryFormSubmit"]:hover' in theme
          sentiment = Path('pages/2_News_Sentiment.py').read_text()
          assert 'fig=go.Figure(go.Bar(x=labels, y=[counts[k] for k in labels],' in sentiment
          assert 'text=[counts[k] for k in labels]' not in sentiment
          assert "counts['Positive']" in sentiment  # Metric counts stay above the bars

          assert 'default="Pages of 10"' in scanner
          assert 'options=["Pages of 10", "Scroll"]' in scanner
          assert 'page_view = visible_view.iloc[(page_no - 1) * 10:page_no * 10].copy()' in scanner
          assert 'args=(editor_key, tuple(page_view["ticker"].astype(str)))' in scanner
          assert 'view.to_csv(index=False)' in scanner  # CSV exports all filtered rows
          assert 'Settings above differ from this saved scan' not in scanner
          assert 'Graph: Check one stock in the results table below' in scanner
          chart = Path('regression_scanner/channel_chart.py').read_text()
          # Visual breathing room on the right, without changing the plotted
          # history, regression calculation or interactive chart controls.
          assert 'margin=dict(l=10, r=110, t=26, b=20)' in chart
          philosophy = Path('pages/00_Investment_Philosophy.py').read_text()
          assert 'label="Open Regression Scanner"' not in philosophy
          assert 'with st.expander("Backtest details and limitations"' in philosophy
          assert 'uirevision=' in chart
          assert 'fig.update_xaxes(autorange=True' in chart
          # Plotly's native autoscale remains the first, prominent toolbar
          # control; subsequent controls keep zoom/pan/reset/export access.
          assert '"displayModeBar": True' in scanner
          assert '"modeBarButtons": [' in scanner
          assert '["autoScale2d"],' in scanner
          assert '"zoom2d", "pan2d", "zoomIn2d", "zoomOut2d", "resetScale2d"' in scanner
          assert '["toImage"],' in scanner
          assert 'content: "Autoscale" !important;' in scanner
          assert '[class*="st-key-channel_chart_"]' in scanner
          assert '"scrollZoom": True' in scanner
          print('Navigation, table layout, graph selection, and export contracts OK')
          PY
