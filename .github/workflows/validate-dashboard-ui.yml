name: Validate dashboard UI source

on:
  pull_request:
    paths:
      - "app.py"
      - "dashboard_theme.py"
      - "pages/00_Investment_Philosophy.py"
      - ".streamlit/config.toml"
      - "pages/0_Stock_Intelligence.py"
      - "pages/1_News_Screen.py"
      - "pages/2_News_Sentiment.py"
      - "regression_scanner/app.py"
      - ".github/workflows/validate-dashboard-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile modified Streamlit pages
        run: |
          python -m py_compile app.py dashboard_theme.py pages/0_Stock_Intelligence.py regression_scanner/app.py
      - name: Verify navigation and pagination controls
        run: |
          python - <<'PY'
          from pathlib import Path
          nav = Path('app.py').read_text()
          theme = Path('dashboard_theme.py').read_text()
          stock = Path('pages/0_Stock_Intelligence.py').read_text()
          scanner = Path('regression_scanner/app.py').read_text()
          assert "title='Metrics & Competition'" in nav
          assert "'Metrics & Competition'" in theme
          assert 'render_page_header("Metrics & Competition"' in stock
          # Load Stock is a primary form submit button. It should visually
          # match Run Scan rather than falling back to the form-default style.
          assert 'type="primary",\n        use_container_width=True' in stock
          assert '[class*="st-key-stock_search"] [data-testid="stFormSubmitButton"]' in stock
          assert 'width: min(240px, 100%)' in stock
          assert 'peers_col, metrics_col = st.columns([1, 1], gap="medium")' in stock
          assert 'st.columns([0.86, 0.14], gap="small")' in stock
          assert 'st.columns([0.91, 0.09], gap="small")' in stock
          assert 'key="stock_price_chart_glass"' in stock
          assert 'key="peer_chart_glass"' in stock
          assert 'max-width: 590px' in stock
          assert 'max-width: 650px' in stock
          assert 'key=f"metrics_risk_period_{symbol}"' in stock
          assert 'with st.container(key="regression_chart_glass"):' in scanner
          assert 'with results_slot.container(key="regression_results_surface"):' in scanner
          assert 'c_filter, c_sort, _filter_deadspace' in scanner
          for marker in (".st-key-stock_price_chart_glass", ".st-key-peer_chart_glass",
                         ".st-key-regression_chart_glass", ".st-key-regression_results_surface"):
              assert marker in theme
          # Action buttons are visually distinct from selected stock/metric chips.
          assert '--si-action-bg:rgba(27,96,149,.92)' in theme
          assert '--si-selection-bg:rgba(13,38,57,.94)' in theme
          assert 'background:var(--si-action-bg) !important;' in theme
          assert 'background:var(--si-selection-bg) !important;' in theme
          assert '[data-testid="stExpander"] summary' in theme
          assert '[data-testid="stMultiSelect"] [data-baseweb="tag"]' in theme
          assert 'type="primary",' in stock
          assert 'on_click=add_custom_comparison_ticker' in stock
          sentiment = Path('pages/2_News_Sentiment.py').read_text()
          assert "st.form_submit_button('Analyze stock', type='primary'" in sentiment
          assert "st.button('Refresh headlines', type='primary'" in sentiment
          # UI terminology and sentiment filters stay aligned across both modes.
          news_screen = Path('pages/1_News_Screen.py').read_text()
          scroll_nav = Path('scroll_nav.py').read_text()
          for source in (nav, theme, news_screen, scroll_nav):
              assert "General News Screen" not in source
              assert "News Screener" in source
          assert "filter_choices=['All','Positive','Neutral','Negative']" in sentiment
          assert "'Negative','Unavailable'" not in sentiment
          # Missing model scores remain visible as 'Unavailable' in All;
          # only the dedicated segmented-control option is removed.
          assert "'Sentiment':'Unavailable'" in sentiment
          config = Path('.streamlit/config.toml').read_text()
          assert 'primaryColor = "#336A8D"' in config
          assert 'button[kind="primaryFormSubmit"]' not in theme  # one shared action style
          assert '[data-testid="stFormSubmitButton"] button' in theme
          assert '[data-testid="stFormSubmitButton"] button:hover' in theme
          assert 'fig=go.Figure(go.Bar(x=labels, y=[counts[k] for k in labels],' in sentiment
          assert 'text=[counts[k] for k in labels]' not in sentiment
          assert "counts['Positive']" in sentiment  # Metric counts stay above the bars

          assert 'default="Pages of 10"' in scanner
          assert 'options=["Pages of 10", "Scroll"]' in scanner
          assert 'page_view = visible_view.iloc[(page_no - 1) * 10:page_no * 10].copy()' in scanner
          assert 'args=(editor_key, tuple(page_view["ticker"].astype(str)))' in scanner
          assert 'view.to_csv(index=False)' in scanner  # CSV exports all filtered rows
          assert 'Settings above differ from this saved scan' not in scanner
          assert 'Graph: Check one stock in the results table below' in scanner
          chart = Path('regression_scanner/channel_chart.py').read_text()
          # Visual breathing room on the right, without changing the plotted
          # history, regression calculation or interactive chart controls.
          assert 'margin=dict(l=10, r=110, t=26, b=20)' in chart
          philosophy = Path('pages/00_Investment_Philosophy.py').read_text()
          assert 'label="Open Regression Scanner"' not in philosophy
          assert 'with st.expander("Backtest details and limitations"' in philosophy
          # The front page must clearly distinguish the actual SPY-funded
          # backtest from an *untested* fundamentals-assisted strategy.
          assert 'HOW THE ROTATING STRATEGY WORKED' in philosophy
          assert 'SPY-funded regression rotation' in philosophy
          assert 'shifted 1% of portfolio capital from SPY' in philosophy
          assert 'maximum of 20% allocated' in philosophy
          assert 'returned ' in philosophy and 'to SPY' in philosophy
          assert '11 of 32' in philosophy
          assert '$374,922' in philosophy and '$370,264' in philosophy
          assert 'WHY THE SCREEN IS STILL WORTH RESEARCHING' in philosophy
          assert 'De Bondt & Thaler (1985)' in philosophy
          assert 'Piotroski (2000)' in philosophy
          assert 'Demerjian, Lev & McVay (2012)' in philosophy
          assert 'This combined screening process is ' in philosophy
          assert 'not yet validated.**' in philosophy
          # Rule-level pre-tax outcomes and portfolio-level tax treatment must
          # remain separate. Never fabricate after-tax results per trade rule.
          assert 'Full-portfolio results, including estimated taxes' in philosophy
          # Do not misrepresent the imposed 52-week exit as an optimal horizon.
          assert 'Recovery-timing clue:' in philosophy
          assert 'median **208 days**' in philosophy
          assert '+20.44 percentage points vs. SPY' in philosophy
          assert '−11.00 points' in philosophy
          assert 'The 52-week cap was imposed, **not proven optimal**' in philosophy
          assert '134 closed trades' in philosophy
          assert '72 hit the recovery target' in philosophy
          assert '62 reached the 52-week timeout' in philosophy
          assert 'before capital-gains taxes' in philosophy
          assert 'not evidence that holding longer would be worse' in philosophy
          assert '| After estimated federal taxes | 11 / 32 | $374,922 | $370,264 | +$4,658 |' in philosophy
          assert '| Before modeled federal taxes | 32 / 32 | $458,879 | $423,602 | +$35,277 |' in philosophy
          assert 'trade-level observations, before modeled taxes' in philosophy
          assert 'Those are **trade-level returns before taxes**' not in philosophy
          assert 'Rule-specific after-tax excess returns and hit rates were **not available**' in philosophy
          assert '[data-testid="stToolbar"]' in theme
          assert '[data-testid="stAppToolbar"]' in theme
          assert '[data-testid="stHeader"]' in theme
          assert 'toolbarMode = "minimal"' in Path('.streamlit/config.toml').read_text()
          assert 'uirevision=' in chart
          assert 'fig.update_xaxes(autorange=True' in chart
          # Plotly's native autoscale remains the first, prominent toolbar
          # control; subsequent controls keep zoom/pan/reset/export access.
          assert '"displayModeBar": True' in scanner
          assert '"modeBarButtons": [' in scanner
          assert '["autoScale2d"],' in scanner
          assert '"zoom2d", "pan2d", "zoomIn2d", "zoomOut2d", "resetScale2d"' in scanner
          assert '["toImage"],' in scanner
          assert 'content: "Autoscale" !important;' in scanner
          assert '.si-regression-axis-help' in scanner
          assert 'with st.container(key="regression_chart_glass"):' in scanner
          assert 'right: 12px !important;' in scanner
          assert 'left: auto !important;' in scanner
          assert 'st.markdown(\n                    \'<div class="si-regression-axis-help">\'' in scanner
          assert '[class*="st-key-channel_chart_"]' in scanner
          assert '"scrollZoom": True' in scanner
          print('Navigation, table layout, graph selection, and export contracts OK')
          PY
